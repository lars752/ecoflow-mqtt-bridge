name: "EcoFlow MQTT Bridge"
version: "1.4.9"
slug: "ecoflow_mqtt_bridge"
description: "Vollständige Standalone MQTT Bridge für EcoFlow Geräte (emuliert alle Adapter-Funktionen & HA Discovery)"
url: "https://github.com/foxthefox/ioBroker.ecoflow-mqtt"
startup: application
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  ecoflow_email: ""
  ecoflow_password: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  haenable: true
  hadebug: false
schema:
  ecoflow_email: "str"
  ecoflow_password: "password(optional)"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str(optional)"
  mqtt_password: "password(optional)"
  haenable: "bool"
  hadebug: "bool"
