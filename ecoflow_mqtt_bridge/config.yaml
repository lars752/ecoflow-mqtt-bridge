name: "EcoFlow MQTT Bridge"
version: "1.0.0"
slug: "ecoflow_mqtt_bridge"
description: "Verbindet EcoFlow-Geräte über MQTT mit Home Assistant"
url: "https://github.com/lars752/ecoflow-mqtt-bridge"
startup: application
boot: auto
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: string?
  mqtt_password: password?
